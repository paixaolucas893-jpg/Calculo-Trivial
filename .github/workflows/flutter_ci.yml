name: Flutter CI

on:
  push:
    branches:
      - main
      - content/university-algebra-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze project
        run: flutter analyze

      - name: Run automated tests
        run: flutter test --reporter expanded

  functions-quality:
    name: Functions lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Functions dependencies
        run: npm ci

      - name: Lint Functions
        run: npm run lint

      - name: Build Functions
        run: npm run build

      - name: Run Functions tests with Firestore Emulator
        working-directory: .
        run: npx --yes firebase-tools emulators:exec --project demo-calculo-trivial --only firestore "npm --prefix functions test"
