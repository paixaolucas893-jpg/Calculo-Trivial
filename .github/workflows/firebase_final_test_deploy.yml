name: Deploy final-test Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-final-test-functions:
    name: Validate and deploy final-test Functions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate deploy credential
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_JSON GitHub secret."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Lint Functions
        run: npm --prefix functions run lint

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Run Functions tests with Firestore Emulator
        run: npx --yes firebase-tools emulators:exec --project calculo-trivial-app-646bb --only firestore "npm --prefix functions test"

      - name: Deploy final-test Functions
        run: >
          npx --yes firebase-tools deploy
          --project calculo-trivial-app-646bb
          --only functions:startFinalTest,functions:submitFinalTest
          --non-interactive
